spring.application.name=booking-service
server.port=8083

# SQLite Configuration
spring.datasource.url=jdbc:sqlite:booking.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.com.example.bookingservice=DEBUG

# Service URLs (for inter-service communication)
service.user-service.url=http://localhost:8080
service.management.url=http://localhost:8082

# JWT Configuration (should match your user-service)
app.jwt.secret=dogparklmao
app.jwt.expiration=900000

# Scheduling configuration
booking.reminder.hours=24,2